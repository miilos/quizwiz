services:
    app:
        build:
            context: ./
            dockerfile: Dockerfile
        container_name: app
        restart: always
        depends_on:
            - mysql
        working_dir: /var/www/
        volumes:
            - ./:/var/www

    nginx:
        image: nginx:1.27.5-alpine
        container_name: nginx
        restart: always
        depends_on:
            - mysql
        ports:
            - "38001:80"
        volumes:
            - ./:/var/www
            - ./nginx:/etc/nginx/conf.d

    mysql:
        image: mysql:latest
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
            MYSQL_DATABASE: app
            MYSQL_USER: ${MYSQL_USER}
            MYSQL_PASSWORD: ${MYSQL_PASSWORD}
        volumes:
            - ./mysql_data:/var/lib/mysql
        ports:
            - "3308:3306"

    phpmyadmin:
        image: phpmyadmin/phpmyadmin:latest
        restart: always
        depends_on:
            - mysql
        environment:
            PMA_HOST: mysql
            MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
        ports:
            - "38003:80"

volumes:
    mysql_data:
